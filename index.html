<title>Zi Garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Serif+SC:wght@600&display=swap">
<style>
:root{
  --bg:#EDF3EA; --surface:#FFFFFF; --surface-2:#E1EBDD; --ink:#1C3A33; --ink-2:#4A655D; --line:#C8D7C4;
  --leaf:#3E9B5F; --stem:#4B8C4D; --soil:#8C6B4B; --soil-2:#6A4F37; --sun:#F2B632;
  --petal:#E5677A; --ok:#2E8C58; --ok-soft:#D7F0DF; --miss:#B85A3E; --miss-soft:#F7E1D8;
  --accent:#1E6B58; --on-accent:#FFFFFF; --focus:#2F6FD6;
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-han:"KaiTi","STKaiti","Kaiti SC","Noto Serif SC","Songti SC","SimSun",serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1D1A; --surface:#172A26; --surface-2:#1F3631; --ink:#E3EEE8; --ink-2:#A2BCB3; --line:#2D4A43;
    --leaf:#5CBB7B; --stem:#62A764; --soil:#7A5D42; --soil-2:#5A4430;
    --ok:#6CCB93; --ok-soft:#1D3F2E; --miss:#EB8D72; --miss-soft:#44261D;
    --accent:#6FD3B4; --on-accent:#0F1D1A; --focus:#8DB8FF;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1D1A; --surface:#172A26; --surface-2:#1F3631; --ink:#E3EEE8; --ink-2:#A2BCB3; --line:#2D4A43;
  --leaf:#5CBB7B; --stem:#62A764; --soil:#7A5D42; --soil-2:#5A4430;
  --ok:#6CCB93; --ok-soft:#1D3F2E; --miss:#EB8D72; --miss-soft:#44261D;
  --accent:#6FD3B4; --on-accent:#0F1D1A; --focus:#8DB8FF;
}
[data-flower="rose"]{--petal:#E5677A}
[data-flower="violet"]{--petal:#9B7BD8}
[data-flower="sky"]{--petal:#4F9FD6}
[data-flower="orange"]{--petal:#EF8A3C}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
#app{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:14px 40px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.han{font-family:var(--f-han);font-weight:600}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
.muted{color:var(--ink-2)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* top bar */
.bar{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand .zi{font-size:40px;line-height:1;color:var(--accent)}
.brand .word{font-family:var(--f-display);font-weight:800;font-size:28px}
.swatches{display:flex;gap:8px;align-items:center}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;color:var(--ink-2);font-size:14px}
.ghost:hover{border-color:var(--ink-2);color:var(--ink)}

/* play card */
.hero{background:var(--surface);border-radius:var(--r);padding:20px;display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;box-shadow:0 2px 0 var(--line)}
.hero h2{font-size:26px}
.big{background:var(--accent);color:var(--on-accent);border:0;border-radius:999px;font-family:var(--f-display);font-weight:800;font-size:26px;padding:12px 36px;box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.big:active{transform:translateY(2px);box-shadow:0 2px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.big:disabled{opacity:.45;cursor:default;transform:none}

/* garden */
.soilbed{margin-top:18px;background:linear-gradient(var(--surface-2),var(--surface-2));border-radius:var(--r);padding:16px}
.soilbed h3{font-size:18px;margin-bottom:10px;color:var(--ink-2);font-weight:700}
.garden{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:10px}
.pot{background:var(--surface);border:0;border-radius:14px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:0}
.pot .hz{font-size:26px;line-height:1.1}
.pot:hover{outline:2px solid var(--line)}
.plant{display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--ink-2)}
.legend span{display:flex;align-items:center;gap:4px}

/* play */
.playtop{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.dots{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.dot{width:16px;height:16px;border-radius:50%;background:var(--surface-2);border:2px solid var(--line)}
.dot.ok{background:var(--leaf);border-color:var(--leaf)}
.dot.miss{background:var(--sun);border-color:var(--sun)}
.dot.now{border-color:var(--ink)}
.prompt{display:flex;flex-direction:column;align-items:center;gap:6px;min-height:170px;justify-content:center}
.speak{width:132px;height:132px;border-radius:50%;border:0;background:var(--petal);color:#fff;box-shadow:0 5px 0 color-mix(in srgb,var(--petal) 60%,#000);display:grid;place-items:center}
.speak:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb,var(--petal) 60%,#000)}
.speak svg{width:64px;height:64px}
.bigzi{font-size:clamp(84px,24vw,128px);line-height:1}
.py{font-family:var(--f-display);font-size:22px;color:var(--ink-2);min-height:1.4em}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.opt{background:var(--surface);border:3px solid var(--line);border-radius:var(--r);min-height:128px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.opt .pic{font-size:clamp(48px,13vw,68px);line-height:1.1}
.opt .hz{font-size:clamp(40px,11vw,58px);line-height:1.1}
.opt .hz.small{font-size:24px}
.opt .en{font-family:var(--f-display);font-size:24px;font-weight:700}
.opt .py{font-size:15px;min-height:0}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--miss);background:var(--miss-soft);opacity:.75}
.opt:disabled{cursor:default}
.feedback{text-align:center;margin-top:16px;min-height:64px;display:flex;flex-direction:column;align-items:center;gap:8px}
.feedback .say{font-family:var(--f-display);font-size:22px}
.previewtag{margin:-8px 0 10px;font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:4px 10px;display:inline-block}
.recword{display:flex;gap:16px;align-items:center;justify-content:center;margin:8px 0 14px}
.recword .han{font-size:64px;line-height:1}
.recword>span:last-child{font-family:var(--f-display);font-size:22px;line-height:1.2}
.recbtn{border:0;border-radius:999px;background:var(--miss);color:#fff;font-weight:700;font-size:20px;padding:10px 26px}
.recbtn.on{background:var(--ink);color:var(--bg);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.65}}
#rec-filter{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--bg)}
.next{background:var(--surface);border:2px solid var(--ink);border-radius:999px;padding:6px 28px;font-family:var(--f-display);font-weight:700;font-size:20px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.opt.wrong{animation:shake .3s}
.opt.right{animation:pop .35s}
.slots{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.slot{width:56px;height:56px;border:3px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:32px}
.slot.filled{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.tray{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.tile{background:var(--surface);border:3px solid var(--line);border-radius:14px;min-width:56px;min-height:56px;font-size:32px;padding:6px 10px}
.tile:disabled{opacity:.3}
.tile.wrong{animation:shake .3s}
.sentbox{font-size:clamp(26px,7vw,36px);text-align:center}

/* done */
.done{text-align:center;display:flex;flex-direction:column;gap:18px;align-items:center}
.done h2{font-size:34px}
.grew{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.grew .pot{animation:pop .5s both}
.teach{background:var(--surface);border-radius:var(--r);padding:16px;width:100%}
.teach h3{font-size:22px;margin-bottom:10px}
.teachgrid{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tchip{background:var(--surface-2);border:3px solid transparent;border-radius:14px;padding:6px 14px;font-size:34px}
.tchip[aria-pressed="true"]{border-color:var(--petal);background:var(--surface)}

/* gate + aunty */
.panel{background:var(--surface);border-radius:var(--r);padding:18px;box-shadow:0 2px 0 var(--line)}
.gate{max-width:420px;margin:30px auto;display:flex;flex-direction:column;gap:12px}
.gate input{font-size:22px;padding:8px 12px;border:2px solid var(--line);border-radius:10px;background:var(--bg);width:140px}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:10px;padding:8px 16px;font-weight:700}
.btn.sec{background:var(--surface-2);color:var(--ink)}
.btn.warn{background:var(--miss);color:#fff}
.btn.small{padding:4px 10px;font-size:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:6px 10px;font-weight:700;color:var(--ink-2)}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:16px}
.aunty h2{font-size:24px}
.aunty h3{font-size:18px;margin-bottom:8px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{background:var(--surface-2);border-radius:10px;padding:6px 2px;text-align:center;font-size:13px}
.day b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.day.none{opacity:.55}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:12px;padding:6px 10px}
.chip .han{font-size:26px;line-height:1}
.chip small{color:var(--ink-2)}
.miss-pill{background:var(--miss-soft);color:var(--miss);border-radius:999px;padding:0 8px;font-size:13px;font-weight:700}
.stages{display:flex;gap:10px;flex-wrap:wrap}
.stage{display:flex;flex-direction:column;align-items:center;font-size:13px;color:var(--ink-2)}
.stage b{font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums}
.ideas{background:var(--surface-2);border-radius:12px;padding:12px 14px}
.ideas li{margin-block:4px}
.note{font-size:14px;color:var(--ink-2)}
.warnnote{font-size:14px;background:var(--miss-soft);color:var(--ink);border-radius:10px;padding:8px 12px}
.words{display:flex;flex-direction:column;gap:8px}
.wrow{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;background:var(--surface-2);border-radius:12px;padding:8px 10px}
.wrow.off{opacity:.55}
.wrow .han{font-size:32px;text-align:center}
.wrow .meta{min-width:0}
.wrow .meta .l1{font-weight:700}
.wrow .meta .l2{font-size:13px;color:var(--ink-2)}
.wrow .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.upl{position:relative;overflow:hidden}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer}
@media (max-width:520px){.wrow{grid-template-columns:52px 1fr}.wrow .acts{grid-column:1/-1;justify-content:flex-start}}
.form{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) auto;gap:8px;align-items:end}
@media (max-width:620px){.form{grid-template-columns:1fr 1fr}}
label.f{display:flex;flex-direction:column;font-size:13px;color:var(--ink-2);gap:2px}
.f input,.f select,textarea{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--bg);width:100%}
textarea{min-height:110px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.set{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app" data-flower="rose">
  <section id="v-garden"></section>
  <section id="v-play" hidden></section>
  <section id="v-done" hidden></section>
  <section id="v-gate" hidden></section>
  <section id="v-aunty" class="aunty" hidden></section>
</div>

<script>
(function(){
const KEY='zigarden.v1';
const INTERVAL=[0,1,2,4,7,14,21,30];
const STAGES=['Seed','Sprout','Leafy','Bud','Flower','Full bloom','Fruit','Big tree'];
const FLOWERS=[['rose','Pink flowers','#E5677A'],['violet','Purple flowers','#9B7BD8'],['sky','Blue flowers','#4F9FD6'],['orange','Orange flowers','#EF8A3C']];
const CONFUSABLE=[
 ['大','太','天','夫','犬'],['人','入','八','个'],['日','目','白','田','旦'],['土','士','王','工'],
 ['木','本','禾','米','来'],['口','日','回'],['小','少','水'],['鸟','乌','马','岛'],['午','牛','年'],
 ['已','己','巳'],['手','毛','看'],['月','用','朋'],['上','下','卡'],['妈','吗','马'],['他','她','地'],
 ['儿','几','九','力'],['山','出','凶'],['子','字','学'],['东','车','乐'],['门','们','问']
];
const SAMPLE=[
 ['猫','māo','cat','🐱','我家有一只＿。'],['狗','gǒu','dog','🐶'],['鱼','yú','fish','🐟','河里有很多＿。'],['鸟','niǎo','bird','🐦'],
 ['马','mǎ','horse','🐴'],['牛','niú','cow','🐮'],['羊','yáng','sheep','🐑'],['花','huā','flower','🌸','公园里有很多＿。'],
 ['树','shù','tree','🌳'],['水','shuǐ','water','💧'],['火','huǒ','fire','🔥'],['山','shān','mountain','⛰️'],
 ['雨','yǔ','rain','🌧️','外面下＿了。'],['书','shū','book','📖','我喜欢看＿。'],['笔','bǐ','pencil','✏️'],['手','shǒu','hand','✋'],
 ['车','chē','car','🚗','爸爸开＿上班。'],['蛋','dàn','egg','🥚'],['家','jiā','home','🏠'],['月亮','yuèliang','moon','🌙','晚上可以看到＿。'],
 ['太阳','tàiyáng','sun','☀️','早上＿出来了。'],['星星','xīngxing','star','⭐'],['眼睛','yǎnjing','eyes','👀'],['耳朵','ěrduo','ears','👂'],
 ['苹果','píngguǒ','apple','🍎','我爱吃红＿。'],['香蕉','xiāngjiāo','banana','🍌'],['米饭','mǐfàn','rice','🍚'],['学校','xuéxiào','school','🏫','我每天去＿。'],
 ['妈妈','māma','mum','👩','我爱我的＿。'],['爸爸','bàba','dad','👨'],['大象','dàxiàng','elephant','🐘'],['老师','lǎoshī','teacher','🧑‍🏫','＿教我们写字。']
];

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
function today(){const d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/86400000);}
function dayLabel(n){return new Date(n*86400000).toLocaleDateString(undefined,{weekday:'short',timeZone:'UTC'});}
function dateLabel(n){return new Date(n*86400000).toLocaleDateString(undefined,{day:'numeric',month:'short',timeZone:'UTC'});}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function mkWord([hz,py,en,pic,sen]){return {id:uid(),hz:hz.trim(),py:(py||'').trim(),en:(en||'').trim(),pic:(pic||'').trim(),sen:(sen||'').trim(),active:true,box:0,due:0,seen:0,right:0,wrong:0,sample:true};}
function defaults(){return {len:8,newPer:3,perDay:2,pinyin:'after',rate:0.6,pitch:1,voice:'',voiceV:2,sfx:true,flower:'rose',aunty:'Aunty',level:'standard'};}
function fresh(){return {v:1,words:SAMPLE.map(mkWord),log:[],saved:[],settings:defaults()};}

let storageOK=true;
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){const s=JSON.parse(raw);
      if(s&&s.v===1&&Array.isArray(s.words)){if(s.settings&&!s.settings.voiceV){if(s.settings.rate===0.8)s.settings.rate=0.6;s.settings.voiceV=2;}s.settings=Object.assign(defaults(),s.settings||{});s.log=s.log||[];s.saved=s.saved||[];return s;}}
  }catch(e){storageOK=false}
  return fresh();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true}catch(e){storageOK=false}}
let S=load();

/* ---------- audio: recordings (IndexedDB) + Chinese computer voice ---------- */
const audioURL=new Map(); let db=null, idbOK=false;
function openDB(){return new Promise(res=>{try{const r=indexedDB.open('zigarden',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('audio');
  r.onsuccess=()=>{db=r.result;idbOK=true;res()}; r.onerror=()=>res();}catch(e){res()}});}
function loadAudio(){return new Promise(res=>{if(!db)return res();try{
  const req=db.transaction('audio','readonly').objectStore('audio').openCursor();
  req.onsuccess=()=>{const c=req.result;if(c){audioURL.set(c.key,URL.createObjectURL(c.value));c.continue();}else res();};
  req.onerror=()=>res();}catch(e){res()}});}
function putAudio(id,blob){const old=audioURL.get(id);if(old)URL.revokeObjectURL(old);audioURL.set(id,URL.createObjectURL(blob));
  if(db){try{db.transaction('audio','readwrite').objectStore('audio').put(blob,id)}catch(e){}}}
function delAudio(id){const old=audioURL.get(id);if(old)URL.revokeObjectURL(old);audioURL.delete(id);
  if(db){try{db.transaction('audio','readwrite').objectStore('audio').delete(id)}catch(e){}}}

let zhVoice=null,zhVoices=[],curAudio=null;
const FEMALE=/xiaoxiao|xiaoyi|xiaohan|xiaomo|xiaoxuan|xiaorui|xiaoshuang|xiaoyan|tingting|ting-ting|huihui|yaoyao|lili|yu-shu|yushu|meijia|mei-jia|google\s*普通话|female|女/i;
const MALE=/kangkang|yunxi|yunyang|yunjian|yunxia|yunze|li-mu|limu|\bmale\b|男/i;
function voiceScore(v){let n=0;
  if(/^zh[-_]CN/i.test(v.lang)||/^cmn/i.test(v.lang))n+=2;
  if(MALE.test(v.name))n-=4;
  if(FEMALE.test(v.name))n+=3;
  if(/natural|online|premium|enhanced/i.test(v.name))n+=1;
  return n;}
function pickVoice(){try{const vs=window.speechSynthesis?speechSynthesis.getVoices():[];
  zhVoices=vs.filter(v=>(/^zh/i.test(v.lang)||/^cmn/i.test(v.lang))&&!/HK|yue|MO/i.test(v.lang));
  zhVoice=zhVoices.find(v=>v.name===S.settings.voice)||zhVoices.slice().sort((a,b)=>voiceScore(b)-voiceScore(a))[0]||null;}catch(e){zhVoice=null;zhVoices=[]}}
try{pickVoice();if(window.speechSynthesis)speechSynthesis.onvoiceschanged=()=>{pickVoice();if(view==='aunty')renderAunty();}}catch(e){}
const canHear=w=>audioURL.has(w.id)||!!zhVoice;
function hush(){try{if(curAudio){curAudio.pause();curAudio=null}if(window.speechSynthesis)speechSynthesis.cancel()}catch(e){}}
function speakText(text){if(!zhVoice)return false;try{hush();const ut=new SpeechSynthesisUtterance(text);
  ut.voice=zhVoice;ut.lang=zhVoice.lang;ut.rate=S.settings.rate;ut.pitch=S.settings.pitch||1;speechSynthesis.speak(ut);return true}catch(e){return false}}
function saySentence(w){if(!speakText(w.sen.replace(/＿/g,w.hz)))say(w);}
function say(w){
  hush();
  const u=audioURL.get(w.id);
  if(u){curAudio=new Audio(u);curAudio.play().catch(()=>{});return true;}
  return speakText(w.hz);
}

/* ---------- in-page recording (needs the game on its own web address) ---------- */
const rec={open:false,ids:[],i:0,status:'idle',msg:'',filter:'missing'};
let mediaRec=null,recStream=null,recTimer=null;
const canRecord=()=>!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
function recMime(){try{return ['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus'].find(t=>MediaRecorder.isTypeSupported(t))||''}catch(e){return ''}}
function openRecorder(startId){
  rec.ids=(startId||rec.filter==='all'?S.words:S.words.filter(w=>!audioURL.has(w.id))).map(w=>w.id);
  rec.i=startId?Math.max(0,rec.ids.indexOf(startId)):0;rec.open=true;rec.status='idle';rec.msg='';
  renderAunty();const el=$('#rec-panel');if(el)el.scrollIntoView({block:'nearest'});
}
function stopTracks(){try{if(recStream)recStream.getTracks().forEach(t=>t.stop())}catch(e){}recStream=null;}
function cancelRec(){clearTimeout(recTimer);try{if(mediaRec&&mediaRec.state!=='inactive'){mediaRec.onstop=null;mediaRec.stop();}}catch(e){}
  mediaRec=null;stopTracks();rec.open=false;rec.status='idle';rec.msg='';}
async function startRec(){
  const w=wordById(rec.ids[rec.i]);if(!w)return;
  hush();
  try{recStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});}
  catch(e){rec.status='error';rec.msg='The microphone is blocked here. Open the game from its own web address (for example GitHub Pages) and allow the microphone when asked. You can still use Add sound to upload voice memos.';renderAunty();return;}
  const chunks=[],mt=recMime();
  try{mediaRec=mt?new MediaRecorder(recStream,{mimeType:mt}):new MediaRecorder(recStream);}catch(e){mediaRec=new MediaRecorder(recStream);}
  const type=mediaRec.mimeType||mt||'audio/webm';
  mediaRec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  mediaRec.onstop=()=>{clearTimeout(recTimer);stopTracks();mediaRec=null;
    const blob=new Blob(chunks,{type});
    if(blob.size<800){rec.status='error';rec.msg='That was too short. Tap Record, then say the word.';renderAunty();return;}
    putAudio(w.id,blob);rec.status='saved';rec.msg='';renderAunty();say(w);};
  mediaRec.start();rec.status='recording';rec.msg='';renderAunty();
  recTimer=setTimeout(stopRec,6000);
}
function stopRec(){try{if(mediaRec&&mediaRec.state==='recording')mediaRec.stop()}catch(e){}}
function recPanel(){
  if(!rec.open)return `<div class="panel" id="rec-panel"><h3>Record words</h3>
    <p class="note">Say each word slowly and clearly, the way you would say it to her. Recordings always play instead of the computer voice.${canRecord()?'':' This browser cannot record, so use Add sound to upload voice memos.'}</p>
    <div class="row" style="margin-top:8px"><button class="btn" id="rec-open" ${canRecord()?'':'disabled'}>Record words one by one</button>
      <select id="rec-filter" aria-label="Which words to record"><option value="missing" ${rec.filter==='missing'?'selected':''}>Only words without a recording</option><option value="all" ${rec.filter==='all'?'selected':''}>All words</option></select></div></div>`;
  const w=wordById(rec.ids[rec.i]);
  if(!w)return `<div class="panel" id="rec-panel"><h3>Record words</h3><p>All done. Every word in this list has been through.</p><div class="row"><button class="btn sec" id="rec-close">Close</button></div></div>`;
  const has=audioURL.has(w.id),busy=rec.status==='recording';
  const main=busy?`<button class="recbtn on" id="rec-stop">■ Stop</button>`:`<button class="recbtn" id="rec-start">● ${has?'Record again':'Record'}</button>`;
  const say=busy?'Recording. Say the word, then tap Stop. It stops by itself after 6 seconds.':rec.status==='saved'?'Saved. Listen, then go to the next word or record again.':'';
  return `<div class="panel" id="rec-panel"><h3>Record words · ${rec.i+1} of ${rec.ids.length}</h3>
    <div class="recword"><span class="han">${esc(w.hz)}</span><span>${esc(w.py)}<br><small class="muted">${esc(w.en)} ${esc(w.pic)}</small></span></div>
    <div class="row" style="justify-content:center">${main}<button class="btn sec" id="rec-play" ${has&&!busy?'':'disabled'}>▶ Play</button></div>
    <p class="note" aria-live="polite" style="text-align:center">${say}</p>${rec.msg?`<p class="warnnote">${esc(rec.msg)}</p>`:''}
    <div class="row" style="justify-content:space-between"><button class="btn sec" id="rec-prev" ${rec.i>0&&!busy?'':'disabled'}>← Back</button><button class="btn sec" id="rec-close">Done</button><button class="btn" id="rec-next" ${busy?'disabled':''}>Next word →</button></div></div>`;
}
function bindRec(){
  const on=(id,f)=>{const el=$(id);if(el)el.onclick=f;};
  on('#rec-open',()=>openRecorder());
  const f=$('#rec-filter');if(f)f.onchange=()=>{rec.filter=f.value;};
  on('#rec-start',startRec);on('#rec-stop',stopRec);
  on('#rec-play',()=>{const w=wordById(rec.ids[rec.i]);if(w)say(w);});
  on('#rec-next',()=>{rec.i++;rec.status='idle';rec.msg='';renderAunty();});
  on('#rec-prev',()=>{rec.i=Math.max(0,rec.i-1);rec.status='idle';rec.msg='';renderAunty();});
  on('#rec-close',()=>{cancelRec();renderAunty();});
}

/* ---------- backup with recordings ---------- */
function getAudioBlob(id){return new Promise(res=>{if(!db)return res(null);try{const r=db.transaction('audio','readonly').objectStore('audio').get(id);r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null);}catch(e){res(null)}});}
function blobToDataURL(b){return new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>res(null);fr.readAsDataURL(b);});}
function dataURLToBlob(u){const m=/^data:([^;,]*)(;base64)?,(.*)$/.exec(u||'');if(!m)return null;
  const bin=m[2]?atob(m[3]):decodeURIComponent(m[3]);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);
  return new Blob([a],{type:m[1]||'audio/webm'});}
async function backupText(){const audio={};
  for(const w of S.words){if(!audioURL.has(w.id))continue;const b=await getAudioBlob(w.id);if(b){const d=await blobToDataURL(b);if(d)audio[w.id]=d;}}
  return JSON.stringify(Object.assign({},S,{audio}));}
let ac=null;
function chime(){if(!S.settings.sfx)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime;
  [659,880].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(.0001,t+i*.11);g.gain.exponentialRampToValueAtTime(.12,t+i*.11+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*.11+.35);
    o.connect(g);g.connect(ac.destination);o.start(t+i*.11);o.stop(t+i*.11+.4);});}catch(e){}}

/* ---------- drawing ---------- */
function plant(box,size){size=size||60;const b=Math.max(0,Math.min(7,box|0));
  let s=`<svg class="plant" viewBox="0 0 64 72" width="${size}" height="${Math.round(size*72/64)}" aria-hidden="true"><ellipse cx="32" cy="64" rx="24" ry="6" fill="var(--soil)"/>`;
  const st=(x,y)=>`<path d="M${x} ${y-5} L${x+1.4} ${y-1.4} L${x+5} ${y} L${x+1.4} ${y+1.4} L${x} ${y+5} L${x-1.4} ${y+1.4} L${x-5} ${y} L${x-1.4} ${y-1.4}Z" fill="var(--sun)"/>`;
  const fruit=(x,y)=>`<circle cx="${x}" cy="${y}" r="3.4" fill="color-mix(in srgb, var(--petal) 75%, black)"/>`;
  if(b===7){
    s+=`<rect x="27.5" y="28" width="9" height="36" rx="3" fill="var(--soil-2)"/>`;
    s+=`<circle cx="22" cy="26" r="13" fill="var(--leaf)"/><circle cx="42" cy="26" r="13" fill="var(--leaf)"/><circle cx="32" cy="15" r="14" fill="var(--leaf)"/>`;
    s+=fruit(20,25)+fruit(40,22)+fruit(30,13);
    s+=st(9,12)+st(55,10);
    return s+'</svg>';
  }
  if(b===0){s+=`<ellipse cx="32" cy="60" rx="6" ry="4" fill="var(--soil-2)"/><path d="M30 57.5 q2 -3.5 4 0" stroke="var(--leaf)" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;}
  else{const top=[0,50,40,32,26,24,24][b];
    s+=`<path d="M32 62 V${top}" stroke="var(--stem)" stroke-width="3" stroke-linecap="round" fill="none"/>`;
    const leaf=(y,k)=>`<path d="M32 ${y} q${-13*k} ${-1*k} ${-15*k} ${-12*k} q${13*k} ${-1*k} ${15*k} ${12*k}z" fill="var(--leaf)"/><path d="M32 ${y} q${13*k} ${-1*k} ${15*k} ${-12*k} q${-13*k} ${-1*k} ${-15*k} ${12*k}z" fill="var(--leaf)"/>`;
    s+=leaf(b===1?56:54,b===1?.55:.9); if(b>=2)s+=leaf(b===2?46:44,.65);
    if(b===3)s+=`<ellipse cx="32" cy="${top-5}" rx="5.5" ry="8" fill="var(--petal)"/><path d="M26.5 ${top-1} q5.5 4 11 0" fill="var(--leaf)"/>`;
    if(b>=4){const r=b>=5?7.5:6.5,cy=top-6;for(let i=0;i<5;i++){const a=(i/5)*Math.PI*2-Math.PI/2;s+=`<circle cx="${(32+Math.cos(a)*r).toFixed(1)}" cy="${(cy+Math.sin(a)*r).toFixed(1)}" r="${r}" fill="var(--petal)"/>`;}
      s+=`<circle cx="32" cy="${cy}" r="${(r*.7).toFixed(1)}" fill="var(--sun)"/>`;}
    if(b>=5)s+=st(11,14)+st(53,10);
    if(b===6)s+=fruit(21,top+7)+fruit(43,top+9);
  }
  return s+'</svg>';}
const speakerIcon=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#fff"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`;

/* ---------- views ---------- */
let view='garden';
function show(v){view=v;['garden','play','done','gate','aunty'].forEach(k=>{$('#v-'+k).hidden=k!==v});window.scrollTo(0,0);}
function applyFlower(){$('#app').dataset.flower=S.settings.flower;}
const sessionsToday=()=>{const d=today();return S.log.filter(l=>l.day===d).length};
const active=()=>S.words.filter(w=>w.active);

function buildQueue(){
  const d=today(),len=S.settings.len,act=active();
  const due=act.filter(w=>w.seen>0&&w.due<=d).sort((a,b)=>a.due-b.due||a.box-b.box);
  const fresh=act.filter(w=>w.seen===0);
  let q=due.slice(0,len);
  q=q.concat(fresh.slice(0,Math.max(0,Math.min(len-q.length,S.settings.newPer))));
  const min=Math.min(5,act.length);
  if(q.length<min){const extra=act.filter(w=>!q.includes(w)&&w.seen>0).sort((a,b)=>a.due-b.due||a.box-b.box);q=q.concat(extra.slice(0,min-q.length));}
  if(q.length<min){q=q.concat(fresh.filter(w=>!q.includes(w)).slice(0,min-q.length));}
  return shuffle(q).map(w=>w.id);
}
function dueCount(){const d=today(),act=active();
  return Math.min(S.settings.len,act.filter(w=>w.seen>0&&w.due<=d).length+Math.min(S.settings.newPer,act.filter(w=>w.seen===0).length));}

function renderGarden(){
  applyFlower();
  const left=Math.max(0,S.settings.perDay-sessionsToday());
  const act=active();
  const n=dueCount();
  const resting=left<=0;
  const msg=act.length<3?'Ask a grown-up to add some words.':resting?'Your garden is resting. Come back tomorrow!':n>0?`${n} plants need water today.`:'Everything is watered. Play for extra sunshine!';
  $('#v-garden').innerHTML=`
    <div class="bar">
      <div class="brand"><span class="zi han">字</span><span class="word">Garden</span></div>
      <div class="row">
        <div class="swatches" role="group" aria-label="Flower colour">${FLOWERS.map(([k,l,c])=>`<button class="sw" style="background:${c}" data-flower="${k}" aria-label="${l}" aria-pressed="${S.settings.flower===k}"></button>`).join('')}</div>
        <button class="ghost" id="to-gate">Grown-ups</button>
      </div>
    </div>
    <div class="hero">
      <div><h2>${esc(msg)}</h2><div class="muted">Tap a plant to hear its word.</div></div>
      <button class="big" id="play" ${resting||act.length<3?'disabled':''}>Play</button>
    </div>
    <div class="soilbed">
      <h3>My garden · ${act.filter(w=>w.box>=4).length} of ${act.length} in flower</h3>
      <div class="garden">${act.map(w=>`<button class="pot" data-say="${w.id}" aria-label="${esc(w.hz)}, ${STAGES[w.box]}">${plant(w.box,58)}<span class="hz han">${esc(w.hz)}</span></button>`).join('')||'<p class="muted">No words yet.</p>'}</div>
      <div class="legend">${STAGES.map((s,i)=>`<span>${plant(i,22)}${s}</span>`).join('')}</div>
    </div>`;
  $('#v-garden').querySelectorAll('.sw').forEach(b=>b.onclick=()=>{S.settings.flower=b.dataset.flower;save();renderGarden();});
  $('#v-garden').querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>{const w=S.words.find(x=>x.id===b.dataset.say);if(w)say(w);});
  $('#to-gate').onclick=openGate;
  const p=$('#play');if(p)p.onclick=startSession;
}

/* ---------- session ---------- */
let sess=null;
const TYPE_LABEL={listen:'Hear → picture',hearchar:'Hear → characters',read:'Read → picture',readen:'Read → English',recall:'Picture → characters',build:'Build the word',sentence:'Sentence'};
function levelOf(){return S.settings.level||'standard';}
function useConfusable(box){
  const lvl=levelOf();
  if(lvl==='gentle')return false;
  if(lvl==='stretch')return box>=2;
  return box>=4;
}
function optCount(box,t){
  const lvl=levelOf();
  if(lvl==='gentle')return 3;
  if(lvl==='stretch')return t==='recall'?5:4;
  return box>=4?4:3;
}
function qType(w,stage){
  const lvl=levelOf(),raw=stage==null?w.box:stage;
  const box=lvl==='gentle'&&!(sess&&sess.preview)?Math.min(raw,5):raw;
  const chars=[...w.hz].length;
  let t;
  if(box<=1)t='listen';
  else if(box<=3)t='hearchar';
  else if(box<=5)t='read';
  else if(box===6)t='recall';
  else{
    const canBuild=chars>=2,canSentence=!!w.sen;
    if(canBuild&&canSentence)t=Math.random()<0.5?'sentence':'build';
    else if(canSentence)t='sentence';
    else if(canBuild)t='build';
    else t='recall';
  }
  if((t==='listen'||t==='hearchar')&&!canHear(w))t='read';
  if((t==='listen'||t==='read'||t==='recall')&&!w.pic)t=canHear(w)?'hearchar':'readen';
  if(t==='build'&&!w.pic)t=canHear(w)?'hearchar':'readen';
  if(t==='hearchar'&&!canHear(w))t='read';
  if(t==='read'&&!w.pic)t='readen';
  return t;
}
function confusablesFor(ch){return CONFUSABLE.find(g=>g.includes(ch))||null;}
function confusableCandidates(w,pool){
  const related=new Set();
  [...w.hz].forEach(ch=>{const g=confusablesFor(ch);if(g)g.forEach(c=>{if(c!==ch)related.add(c);});});
  if(!related.size)return [];
  return pool.filter(x=>[...x.hz].some(c=>related.has(c)));
}
function syntheticConfusable(w,excludeHz){
  const chars=[...w.hz];
  for(const i of shuffle(chars.map((_,i)=>i))){
    const g=confusablesFor(chars[i]);
    if(!g)continue;
    const alt=shuffle(g.filter(c=>c!==chars[i]))[0];
    if(!alt)continue;
    const swapped=chars.slice();swapped[i]=alt;
    const hz=swapped.join('');
    if(hz!==w.hz&&!excludeHz.has(hz))return {id:'syn'+uid(),hz,synthetic:true};
  }
  return null;
}
function pickDecoyChars(target,otherWords,need,allowConfusable){
  const targetSet=new Set(target);
  let pool=[];
  if(allowConfusable){
    target.forEach(ch=>{const g=confusablesFor(ch);if(g)g.forEach(c=>{if(!targetSet.has(c)&&!pool.includes(c))pool.push(c);});});
  }
  pool=shuffle(pool);
  const decoys=pool.slice(0,need);
  if(decoys.length<need){
    const extra=shuffle([...new Set(otherWords.flatMap(x=>[...x.hz]))].filter(c=>!targetSet.has(c)&&!decoys.includes(c)));
    decoys.push(...extra.slice(0,need-decoys.length));
  }
  return decoys;
}
function distractors(w,t,box){
  box=box==null?w.box:box;
  const n=Math.max(1,optCount(box,t)-1);
  let pool=S.words.filter(x=>x.id!==w.id&&x.hz!==w.hz);
  if(t==='listen'||t==='read')pool=pool.filter(x=>x.pic&&x.pic!==w.pic);
  if(t==='readen')pool=pool.filter(x=>x.en&&x.en!==w.en);
  if(t==='hearchar'||t==='recall'||t==='sentence'){const same=pool.filter(x=>[...x.hz].length===[...w.hz].length);if(same.length>=n)pool=same;}
  const actPool=pool.filter(x=>x.active); if(actPool.length>=n)pool=actPool;
  const charOnly=t==='hearchar'||t==='recall'||t==='sentence';
  let chosen=[];
  if(charOnly&&useConfusable(box))chosen=shuffle(confusableCandidates(w,pool)).slice(0,n);
  if(chosen.length<n){
    const rest=shuffle(pool.filter(x=>!chosen.includes(x)));
    chosen=chosen.concat(rest.slice(0,n-chosen.length));
  }
  if(charOnly&&useConfusable(box)&&chosen.length<n){
    const have=new Set(chosen.map(x=>x.hz).concat([w.hz]));
    while(chosen.length<n){const syn=syntheticConfusable(w,have);if(!syn)break;have.add(syn.hz);chosen.push(syn);}
  }
  return chosen.slice(0,n);
}
function startPreview(stage){
  const pool=shuffle(S.words.filter(w=>w.active));
  const fits={
    listen:w=>w.pic&&canHear(w), hearchar:w=>canHear(w), read:w=>w.pic, recall:w=>w.pic,
    build:w=>w.pic&&[...w.hz].length>=2, sentence:w=>!!w.sen
  };
  let items=[];
  if(stage==='all'){
    [['listen',0],['hearchar',2],['read',4],['recall',6],['build',7],['sentence',7]].forEach(([t,box])=>{
      const w=pool.find(x=>fits[t](x)&&!items.some(i=>i.id===x.id));
      if(w)items.push({id:w.id,box,t});
    });
  }else{
    const want=stage===7?pool.filter(x=>x.sen||(x.pic&&[...x.hz].length>=2)):stage===6||stage>=4?pool.filter(x=>x.pic):pool;
    (want.length>=3?want:pool).slice(0,3).forEach(w=>items.push({id:w.id,box:stage,t:null}));
    sess={preview:true};
    items.forEach(i=>{i.t=qType(S.words.find(w=>w.id===i.id),stage);});
  }
  if(!items.length){sess=null;return false;}
  sess={preview:true,items,queue:items.map(i=>i.id),i:0,total:items.length,first:new Map(),retried:new Set(),results:[],grown:[],locked:false,build:null};
  show('play');renderQ();return true;
}
function startSession(){
  const q=buildQueue(); if(!q.length)return;
  sess={queue:q,i:0,total:q.length,first:new Map(),retried:new Set(),results:[],grown:[],locked:false,build:null};
  show('play');renderQ();
}
const cur=()=>S.words.find(w=>w.id===sess.queue[sess.i]);
const curItem=()=>sess&&sess.preview?sess.items[sess.i]:null;
const curBox=w=>{const it=curItem();return it?it.box:w.box};
function dotsHTML(){
  return sess.queue.slice(0,sess.total).map((id,i)=>{const r=sess.first.get(id);return `<span class="dot ${r===true?'ok':r===false?'miss':''} ${i===Math.min(sess.i,sess.total-1)&&sess.i<sess.total?'now':''}"></span>`}).join('');
}
function topBar(){const it=curItem();
  return `<div class="playtop"><button class="ghost" id="stop" aria-label="${sess.preview?'Stop preview':'Stop and go back to the garden'}">✕ Stop</button><div class="dots" aria-hidden="true">${dotsHTML()}</div></div>${it?`<p class="previewtag">Preview · ${STAGES[it.box]} · ${TYPE_LABEL[it.t]} · her progress is not changed</p>`:''}`;}
function renderQ(){
  const w=cur(); if(!w){finish();return;}
  const it=curItem();
  const t=it?it.t:qType(w); sess.t=t; sess.locked=false;
  if(t==='build'){renderBuild(w);return;}
  const box=curBox(w);
  const opts=shuffle([w,...distractors(w,t,box)]);
  const pyAlways=S.settings.pinyin==='always'&&levelOf()!=='stretch';
  let prompt='';
  if(t==='listen'||t==='hearchar')prompt=`<button class="speak" id="speak" aria-label="Hear the word again">${speakerIcon}</button><div class="py muted">Listen, then tap</div>`;
  else if(t==='recall')prompt=`<div class="bigzi">${esc(w.pic)}</div><div class="py">${esc(w.en)}</div>`;
  else if(t==='sentence')prompt=`<div class="sentbox han">${esc(w.sen)}</div>${w.pic?`<div class="bigzi" style="font-size:48px">${esc(w.pic)}</div>`:''}`;
  else prompt=`<div class="bigzi han">${esc(w.hz)}</div><div class="py">${pyAlways?esc(w.py):''}</div>`;
  const optHTML=o=>{
    if(t==='listen')return `<span class="pic">${esc(o.pic)}</span><span class="hz han small">${esc(o.hz)}</span>`;
    if(t==='hearchar'||t==='recall'||t==='sentence')return `<span class="hz han">${esc(o.hz)}</span>${pyAlways&&o.py?`<span class="py">${esc(o.py)}</span>`:''}`;
    if(t==='read')return `<span class="pic">${esc(o.pic)}</span>`;
    return `<span class="en">${esc(o.en)}</span>`;
  };
  $('#v-play').innerHTML=`${topBar()}
    <div class="prompt">${prompt}</div>
    <div class="opts">${opts.map(o=>`<button class="opt" data-id="${o.id}" aria-label="${esc(t==='read'?o.en:t==='readen'?o.en:o.hz)}">${optHTML(o)}</button>`).join('')}</div>
    <div class="feedback" id="fb" aria-live="polite"></div>`;
  $('#stop').onclick=()=>{finish(true)};

}
function renderBuild(w){
  if(!sess.build||sess.build.wid!==w.id){
    const target=[...w.hz];
    const need=2+Math.floor(Math.random()*2);
    const decoys=pickDecoyChars(target,S.words.filter(x=>x.id!==w.id),need,useConfusable(curBox(w)));
    const tiles=shuffle([...target.map((ch,i)=>({id:'t'+i+'-'+uid(),ch,real:true,used:false})),...decoys.map((ch,i)=>({id:'d'+i+'-'+uid(),ch,real:false,used:false}))]);
    sess.build={wid:w.id,target,filled:[],tiles,missed:false};
    setTimeout(()=>say(w),250);
  }
  const b=sess.build;
  const prompt=`<button class="speak" id="speak" aria-label="Hear the word again">${speakerIcon}</button>${w.pic?`<div class="bigzi" style="font-size:56px">${esc(w.pic)}</div>`:''}`;
  const slots=b.target.map((ch,i)=>`<div class="slot han ${i<b.filled.length?'filled':''}">${i<b.filled.length?esc(b.filled[i]):''}</div>`).join('');
  const tray=b.tiles.map(t=>`<button class="tile han" data-tile="${t.id}" ${t.used?'disabled':''}>${esc(t.ch)}</button>`).join('');
  $('#v-play').innerHTML=`${topBar()}
    <div class="prompt">${prompt}</div>
    <div class="slots">${slots}</div>
    <div class="tray">${tray}</div>
    <div class="feedback" id="fb" aria-live="polite"></div>`;
  $('#stop').onclick=()=>{finish(true)};
  const sp=$('#speak'); if(sp)sp.onclick=()=>say(w);
  $('#v-play').querySelectorAll('[data-tile]').forEach(btn=>btn.onclick=()=>buildTap(btn,w));
}
function buildTap(btn,w){
  if(sess.locked)return;
  const b=sess.build,id=btn.dataset.tile,tile=b.tiles.find(x=>x.id===id);
  if(!tile||tile.used)return;
  const need=b.target[b.filled.length];
  if(tile.real&&tile.ch===need){
    tile.used=true;b.filled.push(tile.ch);
    if(b.filled.length===b.target.length){
      sess.locked=true;
      const firstTime=!sess.first.has(w.id),ok=!b.missed;
      if(firstTime){sess.first.set(w.id,ok);if(!sess.preview){sess.results.push({id:w.id,ok,t:'build'});applyResult(w,ok);}}
      chime();say(w);
      const showPy=S.settings.pinyin!=='never';
      renderBuild(w);
      $('#fb').innerHTML=`<div class="say"><span class="han">${esc(w.hz)}</span> ${showPy?esc(w.py):''} ${esc(w.pic)}</div>`;
      setTimeout(advance,1500);
    }else renderBuild(w);
  }else{
    btn.classList.add('wrong');
    setTimeout(()=>btn.classList.remove('wrong'),300);
    if(!b.missed){
      b.missed=true;
      if(!sess.preview&&!sess.retried.has(w.id)){sess.retried.add(w.id);sess.queue.push(w.id);}
    }
  }
}
function applyResult(w,ok){
  const d=today(),wasDue=w.seen===0||w.due<=d,cap=levelOf()==='gentle'?5:7;
  w.seen++;w.last=d;
  if(ok){w.right++;if(wasDue){const nb=Math.min(cap,w.box+1);if(nb>w.box)sess.grown.push(w.id);w.box=nb;w.due=d+INTERVAL[nb];}}
  else{w.wrong++;w.box=Math.max(0,w.box-2);w.due=d+1;}
  save();
}
function answer(btn,w){
  if(sess.locked)return; sess.locked=true;
  const ok=btn.dataset.id===w.id, firstTime=!sess.first.has(w.id);
  if(firstTime){sess.first.set(w.id,ok);if(!sess.preview){sess.results.push({id:w.id,ok,t:sess.t});applyResult(w,ok);}}
  $('#v-play').querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.id===w.id)b.classList.add('right');});
  const showPy=S.settings.pinyin!=='never';
  const fb=$('#fb');
  if(ok){chime();
    if(sess.t==='read'||sess.t==='readen')say(w);
    else if(sess.t==='sentence')saySentence(w);
    fb.innerHTML=`<div class="say"><span class="han">${esc(w.hz)}</span> ${showPy?esc(w.py):''} ${esc(w.pic)}</div>`;
    setTimeout(advance,(sess.t==='read'||sess.t==='readen'||sess.t==='sentence')?1500:1100);
  }else{
    btn.classList.add('wrong');say(w);
    if(!sess.preview&&!sess.retried.has(w.id)){sess.retried.add(w.id);sess.queue.push(w.id);}
    fb.innerHTML=`<div class="say">This one is <span class="han">${esc(w.hz)}</span> ${showPy?esc(w.py):''} ${esc(w.pic)}</div><button class="next" id="next">Next</button>`;
    $('#next').onclick=advance; $('#next').focus();
  }
}
function advance(){if(view!=='play')return;sess.i++;if(sess.i>=sess.queue.length)finish();else renderQ();}
function finish(stopped){

    <div class="panel" id="preview-panel"><h3>Preview a level</h3>
      <p class="note">Play a few questions exactly as she would see them at a stage, using the current Challenge setting. Nothing you answer here changes her garden or her summary.</p>
      <div class="row" style="margin-top:8px"><button class="btn" data-preview="all">One of each question type</button></div>
      <div class="row" style="margin-top:8px">${STAGES.map((n,i)=>`<button class="btn small sec" data-preview="${i}">${esc(n)}</button>`).join('')}</div>
      <p class="note" id="pvmsg" aria-live="polite">${zhVoice||S.words.some(w=>audioURL.has(w.id))?'':'This device has no Chinese voice, so listening questions show as reading questions unless a word has your recording.'}</p>
    </div>
    <div class="panel"><h3>How words move</h3><p class="note">New words start as seeds. Each first-try right answer grows the plant one stage and waits longer before asking again: tomorrow, 2, 4, 7, 14, 21, then 30 days. A miss drops it back two stages and asks again tomorrow. There are 8 stages: seed and sprout ask her to listen and pick a picture; leafy and bud ask her to listen and pick the characters; flower and full bloom ask her to read the characters with no sound; fruit shows just the picture and she taps the characters from memory; big tree words are built character by character from a tray, or used to complete a sentence with a blank. The Challenge setting below changes how many options she sees, whether look-alike characters are mixed in as decoys, and whether the fruit and big tree stages appear at all.</p></div>
    <div class="panel"><h3>Backup</h3>
      <p class="note">The backup includes recordings, so it can be long. To move the game to another phone: tap Copy backup, send the text to yourself (for example on WhatsApp or email), open the game on the other phone, paste it below and choose Restore.</p>
      <div class="row"><button class="btn" id="bk-copy">Copy backup</button><span class="note" id="bkmsg" aria-live="polite"></span></div>
      <textarea id="bk" style="margin-top:8px" placeholder="Backup text appears here. To restore, paste a backup here and choose Restore."></textarea>
      <div class="row" style="margin-top:8px">${confirmReset==='restore'?`<button class="btn warn" id="bk-restore-yes">Replace everything with this backup</button><button class="btn sec" id="cancel">Cancel</button>`:`<button class="btn sec" id="bk-restore">Restore…</button>`}</div>
    </div>
    <div class="panel"><h3>Start over</h3><div class="row">
      ${confirmReset==='progress'?`<button class="btn warn" id="rp-yes">Reset all plants to seeds</button><button class="btn sec" id="cancel">Cancel</button>`:`<button class="btn sec" id="rp">Reset progress…</button>`}
      ${confirmReset==='sample'?`<button class="btn warn" id="rs-yes">Delete my words and load samples</button><button class="btn sec" id="cancel">Cancel</button>`:`<button class="btn sec" id="rs">Load sample words…</button>`}
    </div></div></div>`;
  const bind=(id,key,conv)=>{$(id).onchange=()=>{S.settings[key]=conv($(id).value);save();$('#smsg').textContent='Saved.';}};
  bind('#s-len','len',Number);bind('#s-new','newPer',Number);bind('#s-day','perDay',Number);bind('#s-py','pinyin',String);bind('#s-rate','rate',Number);bind('#s-pitch','pitch',Number);bind('#s-sfx','sfx',v=>v==='true');bind('#s-level','level',String);
  $('#tabbody').querySelectorAll('[data-preview]').forEach(b=>b.onclick=()=>{const v=b.dataset.preview;
    if(!startPreview(v==='all'?'all':Number(v)))$('#pvmsg').textContent='Add at least 3 words in Words & sounds first.';});
  $('#s-voice').onchange=()=>{S.settings.voice=$('#s-voice').value;save();pickVoice();$('#vmsg').textContent=zhVoice?'Now using: '+zhVoice.name:'No Chinese computer voice on this device.';};
  $('#v-test').onclick=()=>{if(!speakText('小猫在花园里。'))$('#vmsg').textContent='No Chinese computer voice on this device. Use recordings.';};
  $('#s-aunty').oninput=()=>{S.settings.aunty=$('#s-aunty').value.trim()||'Aunty';save();};
  let bkReady=null;
  const copyNow=txt=>{const fail=()=>{$('#bk').select();$('#bkmsg').textContent='Backup ready. Tap Copy backup again, or select all the text below and copy it.'};
    try{navigator.clipboard.writeText(txt).then(()=>{$('#bkmsg').textContent='Copied.'},fail)}catch(e){fail()}};
  $('#bk-copy').onclick=async()=>{
    if(bkReady&&$('#bk').value===bkReady){copyNow(bkReady);return;}
    $('#bkmsg').textContent='Preparing backup…';bkReady=await backupText();$('#bk').value=bkReady;copyNow(bkReady);};
  const c=$('#cancel');if(c)c.onclick=()=>{confirmReset=null;renderAunty();};
  const r=$('#bk-restore');if(r)r.onclick=()=>{confirmReset='restore';const keep=$('#bk').value;renderAunty();$('#bk').value=keep;};
  const ry=$('#bk-restore-yes');if(ry)ry.onclick=()=>{try{const s=JSON.parse($('#bk').value);if(!s||s.v!==1||!Array.isArray(s.words))throw 0;
      const audio=s.audio||{};delete s.audio;
      s.settings=Object.assign(defaults(),s.settings||{});s.log=s.log||[];s.saved=s.saved||[];
      [...audioURL.keys()].forEach(delAudio);S=s;
      Object.entries(audio).forEach(([id,u])=>{const b=dataURLToBlob(u);if(b)putAudio(id,b);});
      save();pickVoice();confirmReset=null;renderAunty();$('#bkmsg').textContent=(n=>`Restored ${S.words.length} words and ${n} recording${n===1?'':'s'}.`)(Object.keys(audio).length);}
    catch(e){$('#bkmsg').textContent='That text is not a Zi Garden backup. Paste the whole backup and try again.';}};
  const rp=$('#rp');if(rp)rp.onclick=()=>{confirmReset='progress';renderAunty();};
  const rpy=$('#rp-yes');if(rpy)rpy.onclick=()=>{S.words.forEach(w=>Object.assign(w,{box:0,due:0,seen:0,right:0,wrong:0}));S.log=[];S.saved=[];save();confirmReset=null;renderAunty();};
  const rs=$('#rs');if(rs)rs.onclick=()=>{confirmReset='sample';renderAunty();};
  const rsy=$('#rs-yes');if(rsy)rsy.onclick=()=>{S.words.forEach(w=>delAudio(w.id));const st2=S.settings;S=fresh();S.settings=st2;save();confirmReset=null;renderAunty();};
}

/* ---------- boot ---------- */
async function start(){
  applyFlower();renderGarden();show('garden');
  await openDB();await loadAudio();
  if(view==='garden')renderGarden();
}
try{ if(window.claude&&window.claude.hot&&window.claude.hot.ready){window.claude.hot.ready(start)}else{start()} }catch(e){start()}
})();
</script>
