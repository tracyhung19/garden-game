<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F0EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10170E" media="(prefers-color-scheme: dark)">
<meta name="description" content="A Chinese word garden and spelling-test practice for a new Primary 1 learner.">
<!--pwa-->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zi Garden">
<!--/pwa-->
<title>Zi Garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Serif+SC:wght@600&display=swap">
<link rel="stylesheet" href="theme.css">
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation;-webkit-tap-highlight-color:rgba(75,110,72,.18)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
#app{max-width:600px;margin:0 auto;outline:none;
  padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px));
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.skip{position:absolute;left:12px;top:-60px;background:var(--accent);color:var(--on-accent);padding:8px 14px;border-radius:10px;z-index:80;font-weight:700}
.skip:focus{top:12px}
.han{font-family:var(--f-han);font-weight:600}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
p{margin:.4em 0;text-wrap:pretty}
.muted{color:var(--ink-2)}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:34px;height:34px;border-radius:8px;display:block}
.brand h1{font-size:24px;font-weight:800}
.ghost{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;color:var(--ink-2);font-family:var(--f-display);font-weight:800;font-size:20px}
.lead{margin:6px 0 14px;font-size:18px;color:var(--ink-2)}
.tiles{display:flex;flex-direction:column;gap:12px}
.tile{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-height:96px}
.tile:active{background:var(--surface-2)}
@media (hover:hover){.tile:hover{border-color:var(--accent)}}
.tile .art{flex:none;width:76px;display:grid;place-items:center;align-self:center}
.tile .zi{font-size:34px;line-height:1;color:var(--accent);white-space:nowrap}
.tile .txt{flex:1;min-width:0}
.tile h2{font-size:22px}
.tile .sub{font-size:15px;color:var(--ink-2);margin:2px 0 0}
.tile .go{flex:none;color:var(--muted);font-size:26px}
.tile.small{min-height:72px;padding:14px 18px}
.tile.small .zi{font-size:30px}
.tile.small h2{font-size:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px;text-align:center}
.stat b{display:block;font-family:var(--f-display);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--ink-2)}
.growth{display:flex;justify-content:center;align-items:flex-end;gap:2px;margin-top:22px;opacity:.95}
.growth svg{flex:1;max-width:56px;height:auto}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="hasnav">
<a class="skip" href="#app">Skip to the page</a>
<main id="app" tabindex="-1">
  <div class="bar"><div class="brand"><img src="icon-192.png" alt="" width="34" height="34"><h1>Zi Garden</h1></div><a class="ghost" href="garden.html#how" aria-label="How to play" title="How to play">?</a></div>
  <p class="lead" id="lead">Pick what to do today.</p>
  <div class="tiles">
    <a class="tile" id="t-garden" href="garden.html"><span class="art" id="t-art" aria-hidden="true"></span><span class="txt"><h2>Word garden</h2><p class="sub" id="t-garden-sub">Play to grow your words.</p></span><span class="go" aria-hidden="true">›</span></a>
    <a class="tile" id="t-tx" href="tingxie.html"><span class="art" aria-hidden="true"><span class="zi han" lang="zh-Hans">听写</span></span><span class="txt"><h2>Spelling test practice</h2><p class="sub" id="t-tx-sub">Add this week’s word list.</p></span><span class="go" aria-hidden="true">›</span></a>
    <a class="tile small" id="t-gu" href="garden.html#grownups"><span class="art" aria-hidden="true"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent)"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span><span class="txt"><h2>Grown-ups</h2><p class="sub">Words, sounds, settings and progress.</p></span><span class="go" aria-hidden="true">›</span></a>
  </div>
  <div class="stats" id="stats" hidden>
    <div class="stat"><b id="s-flower">0</b><span>words in flower</span></div>
    <div class="stat"><b id="s-rounds">0</b><span>rounds today</span></div>
    <div class="stat"><b id="s-ready">0</b><span>spelling words ready</span></div>
  </div>
  <div class="growth" id="growth" aria-hidden="true"></div>
</main>
<nav class="bnav" id="bnav" aria-label="Main"></nav>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/86400000);};
const read=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
function plant(box,size){size=size||60;const b=Math.max(0,Math.min(7,box|0));
  let s=`<svg class="plant" viewBox="0 0 64 72" width="${size}" height="${Math.round(size*72/64)}" aria-hidden="true"><ellipse cx="32" cy="64" rx="24" ry="6" fill="var(--soil)"/>`;
  const st=(x,y)=>`<path d="M${x} ${y-5} L${x+1.4} ${y-1.4} L${x+5} ${y} L${x+1.4} ${y+1.4} L${x} ${y+5} L${x-1.4} ${y+1.4} L${x-5} ${y} L${x-1.4} ${y-1.4}Z" fill="var(--sun)"/>`;
  const fruit=(x,y)=>`<circle cx="${x}" cy="${y}" r="3.4" fill="color-mix(in srgb, var(--petal) 75%, black)"/>`;
  if(b===7){
    s+=`<rect x="27.5" y="28" width="9" height="36" rx="3" fill="var(--soil-2)"/>`;
    s+=`<circle cx="22" cy="26" r="13" fill="var(--leaf)"/><circle cx="42" cy="26" r="13" fill="var(--leaf)"/><circle cx="32" cy="15" r="14" fill="var(--leaf)"/>`;
    s+=fruit(20,25)+fruit(40,22)+fruit(30,13);
    s+=st(9,12)+st(55,10);
    return s+'</svg>';
  }
  if(b===0){s+=`<ellipse cx="32" cy="60" rx="6" ry="4" fill="var(--soil-2)"/><path d="M30 57.5 q2 -3.5 4 0" stroke="var(--leaf)" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;}
  else{const top=[0,50,40,32,26,24,24][b];
    s+=`<path d="M32 62 V${top}" stroke="var(--stem)" stroke-width="3" stroke-linecap="round" fill="none"/>`;
    const leaf=(y,k)=>`<path d="M32 ${y} q${-13*k} ${-1*k} ${-15*k} ${-12*k} q${13*k} ${-1*k} ${15*k} ${12*k}z" fill="var(--leaf)"/><path d="M32 ${y} q${13*k} ${-1*k} ${15*k} ${-12*k} q${-13*k} ${-1*k} ${-15*k} ${12*k}z" fill="var(--leaf)"/>`;
    s+=leaf(b===1?56:54,b===1?.55:.9); if(b>=2)s+=leaf(b===2?46:44,.65);
    if(b===3)s+=`<ellipse cx="32" cy="${top-5}" rx="5.5" ry="8" fill="var(--petal)"/><path d="M26.5 ${top-1} q5.5 4 11 0" fill="var(--leaf)"/>`;
    if(b>=4){const r=b>=5?7.5:6.5,cy=top-6;for(let i=0;i<5;i++){const a=(i/5)*Math.PI*2-Math.PI/2;s+=`<circle cx="${(32+Math.cos(a)*r).toFixed(1)}" cy="${(cy+Math.sin(a)*r).toFixed(1)}" r="${r}" fill="var(--petal)"/>`;}
      s+=`<circle cx="32" cy="${cy}" r="${(r*.7).toFixed(1)}" fill="var(--sun)"/>`;}
    if(b>=5)s+=st(11,14)+st(53,10);
    if(b===6)s+=fruit(21,top+7)+fruit(43,top+9);
  }
  return s+'</svg>';}
const NAVI={
  home:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',
  garden:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21v-9"/><path d="M12 13c0-4 3-7 8-7 0 5-3 8-8 7z"/><path d="M12 15c0-3-2-5-6-5 0 4 2 6 6 5z"/></svg>',
  pencil:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-4L17 4l3 3L8 19z"/><path d="M14 7l3 3"/></svg>',
  lock:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>'};
$('#bnav').innerHTML=`<ul><li><a href="index.html" aria-current="page">${NAVI.home}<span>Home</span></a></li><li><a href="garden.html">${NAVI.garden}<span>Garden</span></a></li><li><a href="tingxie.html">${NAVI.pencil}<span lang="zh-Hans" class="han" style="font-size:13px">听写</span></a></li><li><a href="garden.html#grownups">${NAVI.lock}<span>Grown-ups</span></a></li></ul>`;
$('#growth').innerHTML=[0,1,2,3,4,5,6,7].map(i=>plant(i,56)).join('');

/* garden */
const g=read('zigarden.v1'),parts=[];let lead='';
if(g&&Array.isArray(g.words)){
  const set=Object.assign({len:10,newPer:5},g.settings||{}),t=today();
  const act=g.words.filter(w=>w.active),due=act.filter(w=>w.seen>0&&w.due<=t).length,fresh=act.filter(w=>w.seen===0).length;
  const n=Math.min(set.len,due+Math.min(set.newPer,fresh)),flowers=act.filter(w=>w.box>=4).length;
  const top=act.reduce((m,w)=>Math.max(m,w.box||0),0);
  $('#t-art').innerHTML=plant(top,64);
  $('#t-garden-sub').textContent=act.length<3?'Ask a grown-up to add some words.':n>0?`${n} plant${n===1?'':'s'} need water today.`:'Everything is watered. Play for extra sunshine!';
  $('#s-flower').textContent=flowers;
  const rounds=(g.log||[]).filter(l=>l.day===t).length;$('#s-rounds').textContent=rounds;
  $('#stats').hidden=false;
  if(n>0)parts.push(`${n} plant${n===1?'':'s'} need water`);
}else{$('#t-art').innerHTML=plant(0,64);$('#t-garden-sub').textContent='Tap to start. Play a short round.';}

/* spelling */
const tx=read('zitingxie.v1'),L=tx&&Array.isArray(tx.lists)?tx.lists.find(l=>l.id===tx.cur):null;
if(L){
  const status=w=>{const h=w.hist||[];if(!h.length)return 'new';if(!h[h.length-1].ok)return 'shaky';const d=new Set(h.filter(x=>x.ok&&!x.pk).map(x=>x.d));return d.size>=2&&!h.slice(-3).some(x=>!x.ok)?'ready':'learning';};
  const ready=L.words.filter(w=>status(w)==='ready').length,dl=L.test==null?null:L.test-today();
  const when=dl==null?`${L.words.length} words`:dl<0?(L.real?'Test done':'Test done. Add her result.'):dl===0?'Test today':dl===1?'Test tomorrow':`Test in ${dl} days`;
  $('#t-tx-sub').textContent=`${when} · ${ready} of ${L.words.length} ready`;
  $('#s-ready').textContent=ready;$('#stats').hidden=false;
  if(dl!=null&&dl>=0&&dl<=3)parts.push(when.toLowerCase());
}
$('#lead').textContent=parts.length?`Today: ${parts.join(' · ')}.`:(g||L?'Welcome back.':'Welcome. Start with a short round in the garden.');
})();
</script>
</body>
</html>
